<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="Orbit，你的搜索与收藏星系。">
  <title>ORBIT · 你的新标签页</title>
  <link rel="stylesheet" href="style.css?v=18">
  <script src="app.js?v=18" defer></script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="reading-shade" aria-hidden="true"></div>

  <header class="corner-header">
    <a id="inbox" class="inbox" href="https://outlook.live.com/mail/0/" target="_blank" rel="noopener noreferrer" aria-label="打开 Outlook 邮箱，未读数尚未连接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
      <span class="inbox-copy"><span class="inbox-heading">OUTLOOK <span>INBOX</span></span><span class="inbox-detail"><span id="unread-count">—</span> <span id="inbox-state">未连接</span></span></span>
    </a>
    <button class="weather" id="weather" aria-label="设置天气城市">
      <span class="weather-copy"><span id="weather-city">上海</span><span class="weather-reading"><span id="weather-detail">正在获取天气</span> <strong id="temperature">—</strong></span></span>
      <span id="weather-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 15.6A8.5 8.5 0 0 1 8.4 4 8.5 8.5 0 1 0 20 15.6Z"/></svg></span>
    </button>
  </header>

  <main>
    <section class="launchpad" aria-label="时间与搜索">
      <h1 id="clock" aria-label="当前时间">00<span>:</span>00</h1>
      <div id="date" class="date"></div>
      <form id="search" role="search">
        <label class="sr-only" for="query">百度搜索或输入网址</label>
        <svg class="search-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
        <input id="query" name="wd" placeholder="下一站，去哪？" autocomplete="off" spellcheck="false">
        <button type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></button>
        <span class="engine">百度搜索 · 输入网址直达</span>
      </form>
    </section>

    <section class="orbit-stage" aria-label="收藏星系">
      <h2 class="sr-only">收藏网站</h2>
      <div id="shortcuts" class="shortcuts"></div>
      <div id="empty-state" class="empty-state" hidden>添加一个网站，点亮第一颗星。</div>
    </section>
  </main>

  <nav class="orbit-tools" aria-label="星系设置">
    <button id="add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>添加</span></button>
    <button id="edit" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Z"/><path d="m13 7 4 4"/></svg><span>编辑</span></button>
    <button id="motion" type="button" aria-pressed="false" aria-label="暂停动效"><svg class="pause-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><svg class="play-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg><span>暂停动效</span></button>
  </nav>

  <a class="store" href="https://chromewebstore.google.com/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Chrome 扩展商店</span></a>
  <p id="storage-notice" class="storage-notice" role="status" hidden></p>

  <dialog id="editor">
    <form id="link-form">
      <div class="dialog-head"><h2 id="dialog-title">添加网站</h2><button type="button" class="close" aria-label="关闭">×</button></div>
      <label>网站名称<input id="link-name" required maxlength="40" placeholder="例如：Notion"></label>
      <label>网址<input id="link-url" required placeholder="https://www.notion.so"></label>
      <p id="link-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="delete" class="delete">删除</button><button class="save" type="submit">保存</button></div>
    </form>
  </dialog>
  <dialog id="city-dialog">
    <form id="city-form">
      <div class="dialog-head"><h2>天气城市</h2><button type="button" class="close" aria-label="关闭">×</button></div>
      <label>城市名称<input id="city-input" placeholder="上海 / Shanghai" required></label>
      <p class="hint">天气由 Open-Meteo 提供。</p>
      <p id="city-error" class="error" role="status"></p>
      <div id="city-results"></div>
      <button class="save" id="city-submit" type="submit">查找城市</button>
    </form>
  </dialog>
</body>
</html>
